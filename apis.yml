aid: payrails
name: Payrails
description: >-
  Payrails is a modular payment and financial infrastructure platform — "the operating
  system for profitable growth" — that gives merchants unified control over payments,
  tokenization, and financial data. Its API and SDKs orchestrate payments across many
  payment service providers (Adyen, Stripe, Checkout.com, Braintree, Klarna, and 100+
  local methods), with a PCI-certified token vault, network tokenization, 3D Secure,
  a no-code Workflow Studio for routing and decisioning, automated reconciliation,
  chargeback/dispute management, fraud screening, and unified analytics. Authentication
  is OAuth 2.0 client-credentials (plus optional mTLS); events are delivered as
  HMAC-signed webhooks. Used by Eneba, PUMA, Vinted, Preply, inDrive, Just Eat, and Careem.
